# +----------------------------------------------------------------------
# | @project   本心通用管理后台 / BenxinAdminPro
# | @mission   demo 配置示例 — 占位值，复制为 config.local.yaml 填入真实值
# | @author    仗键天涯(daxing)
# | @email     3442535897@qq.com
# | @date      2026-06-08 04:00:00
# +----------------------------------------------------------------------
#
# 复制此文件为 config.local.yaml 并填入真实值。
# config.local.yaml 已在 .gitignore 中排除。
# 密钥生成：openssl rand -base64 32

app:
  table_prefix: "demo_"
  redis_key_prefix: "demo"
  port: 8080

errcode:
  security_segment_base: 11000

# T-009a 禁搜索引擎收录（X-Robots-Tag 响应头，部署级静态配置）。
# 默认安全：整段省略也走「开 + noindex, nofollow」（main.go SetDefault 兜底）。
# 私有化部署若需被企业内搜索引擎索引：enabled 设 false（并按部署文档删 admin robots.txt/meta）。
security:
  x_robots_tag:
    enabled: true                 # 缺省即 true（默认禁收录）
    content: "noindex, nofollow"  # 缺省即此值

crypto:
  header_prefix: "X-Ca-"
  aes_key_b64: ""          # openssl rand -base64 32 → 解码须 32 字节
  hmac_key_b64: ""         # openssl rand -base64 32

jwt:
  issuer: "benxinadminpro-demo"
  access_secret: ""        # 强随机字符串
  refresh_secret: ""       # 与 access_secret 不同
  access_ttl_seconds: 7200
  refresh_ttl_seconds: 604800
  refresh_rotate: true

auth:
  argon2id:
    memory_kib: 19456
    iterations: 2
    parallelism: 1
    salt_len: 16
    key_len: 32
  captcha:
    enabled: true
    ttl_seconds: 120
    length: 4
  lockout:
    captcha_threshold: 3
    lock_threshold: 5
    fail_window_seconds: 900
    lock_duration_seconds: 900

rbac:
  super_admin_roles: ["super_admin"]

hashid:
  salt: ""                 # 必填，不可空
  min_length: 8

gcm:
  key_b64: ""              # openssl rand -base64 32 → 解码须 32 字节（配置加密用）

file:
  max_size_bytes: 104857600   # 100MB（T-011c：抬高以便验收 >50MB 大视频预览降级路径）
  allowed_exts: ["jpg","jpeg","png","gif","pdf","docx","xlsx","zip","txt","mp4","webm","mov","mp3","wav","ogg","m4a"]
  local:
    root_dir: "./uploads"
    url_prefix: "/sys/files/"

seed:
  # 种子用户初始密码 —— 占位为空，复制为 config.local.yaml 后填入真实值。
  # 零明文默认值：任一缺失启动即 fail-fast（见 seed.go）。
  # 生产经环境变量逐项注入（同超管机制）：DEMO_SEED_ADMIN_PASSWORD / DEMO_SEED_EDITOR_PASSWORD ...
  admin_password: ""       # super_admin 超管
  editor_password: ""      # editor 编辑员（data_scope=Self）
  dept_mgr_password: ""    # dept_mgr 部门经理（data_scope=Dept）
  biz_user_password: ""    # biz_user 业务员（无角色）

redis:
  addr: "localhost:6379"
  db: 0
  password: ""

mysql:
  dsn: "root:root@tcp(localhost:3306)/benxinadminpro?charset=utf8mb4&parseTime=true&loc=Local"
