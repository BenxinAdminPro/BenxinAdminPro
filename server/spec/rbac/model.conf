[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# T-003b 变更：obj 由 URL path 改为 perm code 精确匹配。
# 原 T-001: keyMatch2(r.obj, p.obj) — URL 路径模式匹配
# 现 T-003b: r.obj == p.obj — 权限码精确匹配（如 sys:user:list）
# 影响：PHP parity 需同步更新 matchers；旧 path 形式 p 规则不再兼容。
m = g(r.sub, p.sub) && r.obj == p.obj && (r.act == p.act || p.act == "*")
