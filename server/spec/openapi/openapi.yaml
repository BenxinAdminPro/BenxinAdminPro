# | @date      2026-06-07 14:19:00
# | @updated   2026-06-08 03:25:00
# | @updated   2026-06-09 10:40:13  T-003e：对外 ID 入参收口 hashid，入出参对称
# | @updated   2026-06-09 16:09:17  T-004d：system 对外 ID 全链路 hashid（出参+path :id），补全 dict/config item 路径
# | @updated   2026-06-14 15:35:00  T-005b-4 v0.11.0 列表查询能力；T-008b v0.12.0 用户详情加 roles 出参
# | @updated   2026-06-16 11:55:00  T-011b v0.15.0 文件 mime 大类筛 + 批量软删端点
