          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /sys/files/batch-delete:
    post:
      tags: [File]
      summary: 批量软删文件
      description: "T-011b：批量软删（复用 sys:file:delete 权限码）。入参 ids 为 hashid 数组（非空、封顶 100）；单条 IN bulk 幂等软删（已删/不存在 id 自然跳过），出参 deleted_count=实际软删行数；物理文件异步清理。非法 hashid/空数组/超 100 → 400。"
      operationId: batchDeleteFiles
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                  description: "对外 hashid 数组（非空、最多 100）"
      responses:
        "200":
          description: 批量软删成功（data.deleted_count = 实际软删行数）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "400":
          description: 空数组 / 超封顶 100 / 含非法 hashid

  /sys/files/{id}/download:
    get:
      tags: [File]
      summary: 鉴权下载文件
      operationId: downloadFile
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: 文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /sys/files/{id}:
    delete:
      tags: [File]
      summary: 删除文件
      operationId: deleteFile
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
