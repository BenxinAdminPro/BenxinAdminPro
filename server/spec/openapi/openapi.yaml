openapi: "3.0.3"

info:
  title: BenxinAdminPro API
  description: |
    本心通用管理后台底座 API 规范。
    v0.1.0: 安全头、C 端加密信封格式和统一安全错误码段。
    v0.2.0: 认证接口（登录/刷新/登出/验证码）。
    v0.3.0: 组织架构（用户/部门/岗位 CRUD）。
    v0.4.0: RBAC 核心（角色/菜单/权限 + Casbin 联动 + Hashid）。
    v0.5.0: 数据权限（角色数据范围 + 行级过滤）。
    v0.6.0: 系统管理（字典/参数/操作日志/登录日志 + response Registry）。
    v0.7.0: 文件管理（StorageDriver + 本地驱动 + 鉴权下载 + 上传安全）。
    v0.8.0: 配置中心（缓存+热加载+GCM加密+迁移执行器）。
    v0.8.1: 验证码修复（开源字体渲染清晰字符 + /auth/precheck 告知是否需要验证码，前端按需显示）。
    v0.9.0: 对外 ID 入参收口 hashid（T-003e）。RBAC 实体（用户/部门/岗位/角色/菜单）的对外 ID
            入出参均为 hashid 字符串（path :id、body dept_id/post_ids/role_ids/menu_ids/parent_id、
            query dept_id），与出参对称；非法/伪造 hashid 一律 400，绝不回落、不暴露内部自增 id。
            PHP parity 约定：上述对外 ID 字段在请求与响应中均为 hashid 字符串，禁裸自增整数。
    v0.10.0: system 实体对外 ID 全链路 hashid 化（T-004d）。字典/参数/文件/操作日志/登录日志的
            出参 id 与 path :id（dict/config 的 PUT/DELETE、file download/delete）均为 hashid 字符串；
            非法/伪造 :id → 400。补全此前缺失的 /sys/dict/types/{id}、/sys/dict/data/{id}、
            /sys/configs/{id} 三组 item 路径定义。hasher 抽至中立包 idcodec 供 rbac/system 共用（解耦）。
            PHP parity 扩展：system 对外 ID 亦为 hashid 字符串。注：system 响应 data 体未在 schema
            强类型化（沿用 ApiResponse 泛型包络），id 为 hashid 字符串这一约定以本说明为准。
    v0.11.0: system/日志列表查询能力（T-005b-4）。dict/config/oper_log/login_log 列表补关键字模糊、
            排序白名单、时间范围；dict_data 改服务端真分页。oper_log/sys_file 出参加 operator_name/
            uploader_name（内部 ID JOIN sys_user 解析为用户名，已注销→「已注销」、空→「匿名」）。
    v0.12.0: 用户出参加 roles（T-008b）。GET /sys/users/:id（预载）与 GET /sys/users（列表批量回填、
            固定查询非 N+1）均返已授角色（id hashid + code/name）；无角色 omitempty 不输出。
            供「分配角色」弹窗回填 + 列表角色列展示。写路径 PUT /sys/users/:id/roles（hashid 全量覆写）不变。
    v0.13.0: 角色出参加 menu_ids（T-008c）。GET /sys/roles/:id 预载已授菜单 ID（hashid 数组、详情 only、
            omitempty），供角色授权树（el-tree check-strictly）回填。写路径 PUT /sys/roles/:id/menus 不变。
    v0.14.0: 配置加密参数写链路（T-005b-3）。createConfig 入参加 is_encrypted（0/1，=1 走 GCM 加密落库）；
            updateConfig 编辑态键/类型锁定（不接受 config_key/is_encrypted），config_value 指针三态：
            省略=保持原值（不破坏密文）、传入=按现有 is_encrypted 加密或明文覆写。列表/详情仍恒脱敏 ******。
    v0.15.0: 文件 mime 大类筛 + 批量软删（T-011b）。GET /sys/files 加 mime_category 查询参数
            （枚举 image/video/audio/other，后端 token→前缀白名单映射，未命中/空不筛）。新增
            POST /sys/files/batch-delete（复用 sys:file:delete 权限码）：入参 ids hashid 数组
            （非空、封顶 100），单条 IN bulk 幂等软删，出参 deleted_count=实际软删行数；非法 hashid/
            空数组/超 100 → 400（复用 sys.invalid_id / 通用 400）。零新增错误码段、零 DDL。
            搭车补回：T-009b 的菜单专属父节点错误码 ErrInvalidParentMenu（RBAC offset 47 /
            sys.invalid_parent_menu，Go 常量 T-009b 已落并在用）原计划 0.14.1 但从未落入 openapi.yaml
            （c9db3a9 diff 未含本文件），本版于错误码段说明中一并物化；纯文档补全、无 Go 行为/端点/schema 变更。
  version: "0.15.0"
  contact:
    name: 仗键天涯(daxing)
    email: 3442535897@qq.com

servers:
  - url: http://localhost:8080
    description: 本地开发

# ---------------------------------------------------------------------------
# 安全定义
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    X-Ca-Timestamp:
      name: X-Ca-Timestamp
      in: header
      required: true
      description: Unix 秒时间戳（字符串）
      schema:
        type: string
        example: "1750000000"

    X-Ca-Nonce:
      name: X-Ca-Nonce
      in: header
      required: true
      description: 客户端随机串，建议 16-32 位 [A-Za-z0-9]
      schema:
        type: string
        example: "abc123nonce456def"

    X-Ca-Signature:
      name: X-Ca-Signature
      in: header
      required: true
      description: |
        base64(HMAC-SHA256(hmac_key, SIGNING_STRING))
        SIGNING_STRING = UPPER(method) \n path \n timestamp \n nonce \n BODY_B64
      schema:
        type: string

  schemas:
    # --- T-001 安全信封 ---
    EncryptedEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: string
          description: base64(IV(16B) || AES-256-CBC-PKCS7(plaintext))

    SecurityError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: |
            逻辑错误码 = security_segment_base + offset（本表为采样说明、非逐码穷举）。
            T-001 offset: +1~+9 (security)
            T-002 offset: +20~+24 (auth)
            RBAC 段含菜单专属父节点码 +47 (sys.invalid_parent_menu) —— T-009b 追补，v0.15.0 一并物化。
          example: 11001
        message:
          type: string
          description: i18n key
          example: "security.missing_headers"

    # --- T-002 认证 ---
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 0=成功，其它=错误码
        message:
          type: string
        data:
          description: 业务数据

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        captcha_id:
          type: string
          description: 失败达阈值后必填
        captcha_code:
          type: string
          description: 失败达阈值后必填

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        access_exp:
          type: integer
          format: int64
        refresh_exp:
          type: integer
          format: int64
        token_type:
          type: string
          example: Bearer

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: 可选，同时拉黑 refresh

    CaptchaResponse:
      type: object
      properties:
        captcha_id:
          type: string
        image_base64:
          type: string
          description: data:image/png;base64,...
        expires_in:
          type: integer
          description: 秒

    # --- T-003a 组织架构 ---
    SysUser:
      type: object
      properties:
        id: { type: string, description: "对外 ID(hashid 字符串)" }
        username: { type: string }
        nickname: { type: string }
        avatar: { type: string }
        email: { type: string }
        mobile: { type: string }
        dept_id: { type: string, nullable: true, description: "部门对外 ID(hashid)，无部门=null" }
        status: { type: integer }
        remark: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        roles:
          type: array
          description: "T-008b：已授角色。详情 GET /sys/users/:id 与列表 GET /sys/users 均返（列表为批量回填、固定查询非 N+1）；无角色时 omitempty 不输出。供分配角色弹窗回填 + 列表角色列展示。"
          items: { $ref: "#/components/schemas/SysRole" }

    SysDept:
      type: object
      properties:
        id: { type: string, description: "对外 ID(hashid 字符串)" }
        parent_id: { type: string, description: "父级对外 ID(hashid)，空=根" }
        ancestors: { type: string }
        name: { type: string }
        sort: { type: integer }
        leader: { type: string }
        status: { type: integer }
        children:
          type: array
          items: { $ref: "#/components/schemas/SysDept" }

    SysPost:
      type: object
      properties:
        id: { type: string, description: "对外 ID(hashid 字符串)" }
        code: { type: string }
        name: { type: string }
        sort: { type: integer }
        status: { type: integer }

    SysRole:
      type: object
      properties:
        id: { type: string, description: "对外 ID(hashid 字符串)" }
        code: { type: string }
        name: { type: string }
        sort: { type: integer }
        status: { type: integer }
        data_scope:
          type: integer
          enum: [1, 2, 3]
          description: "数据权限 1=全部 2=仅本人 3=本部门"
          default: 2
        remark: { type: string }
        menu_ids:
          type: array
          items: { type: string }
          description: "已授菜单对外 ID(hashid) 全量集合，含 M/C/F 三层。仅角色详情 GET /sys/roles/{id} 预载返回，列表不含。授权树弹窗回填来源（全量覆写须返全集）。"

    SysMenu:
      type: object
      properties:
        id: { type: string, description: "对外 ID(hashid 字符串)" }
        parent_id: { type: string, description: "父级对外 ID(hashid)，空=根" }
        ancestors: { type: string }
        menu_type: { type: string, enum: [M, C, F] }
        name: { type: string }
        perm_code: { type: string }
        path: { type: string }
        component: { type: string }
        icon: { type: string }
        sort: { type: integer }
        visible: { type: integer }
        status: { type: integer }
        children:
          type: array
          items: { $ref: "#/components/schemas/SysMenu" }

    PageResult:
      type: object
      properties:
        list: { type: array, items: {} }
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }

    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        nickname: { type: string }
        email: { type: string }
        mobile: { type: string }
        dept_id: { type: string, description: "部门对外 ID(hashid)，空=无部门" }
        status: { type: integer }
        post_ids:
          type: array
          items: { type: string, description: "岗位对外 ID(hashid)" }

  responses:
    EncryptedResponse:
      description: C 端加密响应
      headers:
        X-Ca-Timestamp:
          schema:
            type: string
        X-Ca-Nonce:
          schema:
            type: string
        X-Ca-Signature:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EncryptedEnvelope"

    SecurityErrorResponse:
      description: 安全校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SecurityError"

# ---------------------------------------------------------------------------
# 路径
# ---------------------------------------------------------------------------
paths:
  /auth/captcha:
    post:
      tags: [Auth]
      summary: 获取图形验证码
      operationId: issueCaptcha
      security: []
      responses:
        "200":
          description: 验证码
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CaptchaResponse"

  /auth/precheck:
    post:
      tags: [Auth]
      summary: 登录前置检查 — 是否需要验证码
      description: >
        服务端权威信号：返回该用户名当前是否需要验证码（失败计数达 captcha_threshold）。
        前端据此按需显示验证码框。注意这是 UX 信号，登录是否强制校验由 /auth/login 独立判定，前端不可绕过。
      operationId: loginPrecheck
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        "200":
          description: 是否需要验证码
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          captcha_required:
                            type: boolean
                            description: 本次登录是否需要验证码

  /auth/login:
    post:
      tags: [Auth]
      summary: 登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TokenResponse"
        "400":
          description: 验证码相关错误 (captcha_required / captcha_invalid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityError"
        "401":
          description: 认证失败 (bad_credentials)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityError"
        "403":
          description: 账号禁用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityError"
        "423":
          description: 账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityError"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新令牌
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TokenResponse"
        "401":
          description: 令牌无效/过期/已吊销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityError"

  /auth/logout:
    post:
      tags: [Auth]
      summary: 登出
      operationId: logout
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityError"

  # --- T-003a 组织架构 ---
  /sys/users:
    get:
      tags: [System]
      summary: 用户分页列表
      operationId: listUsers
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: username, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: integer } }
        - { name: dept_id, in: query, schema: { type: string }, description: "按部门过滤，对外 ID(hashid)" }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PageResult" }
    post:
      tags: [System]
      summary: 新建用户
      operationId: createUser
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SysUser" }

  /sys/users/{id}:
    get:
      tags: [System]
      summary: 用户详情
      operationId: getUser
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "对外 ID(hashid 字符串)" }
      responses:
        "200":
          description: 用户详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SysUser" }
    put:
      tags: [System]
      summary: 更新用户
      operationId: updateUser
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "对外 ID(hashid 字符串)" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SysUser" }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
    delete:
      tags: [System]
      summary: 删除用户
      operationId: deleteUser
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "对外 ID(hashid 字符串)" }
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /sys/users/{id}/password:
    put:
      tags: [System]
      summary: 重置密码
      operationId: resetUserPassword
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "对外 ID(hashid 字符串)" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: 重置成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /sys/users/{id}/status:
    put:
      tags: [System]
      summary: 启用/禁用用户
      operationId: setUserStatus
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "对外 ID(hashid 字符串)" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: integer }
      responses:
        "200":
          description: 设置成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /sys/depts/tree:
    get:
      tags: [System]
      summary: 部门树
      operationId: getDeptTree
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: 部门树
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SysDept" }

  /sys/depts:
    post:
      tags: [System]
      summary: 新建部门
      operationId: createDept
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SysDept" }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SysDept" }

