openapi: "3.0.3"

info:
  title: BenxinAdminPro API
  description: |
    本心通用管理后台底座 API 规范。
    v0.1.0: 安全头、C 端加密信封格式和统一安全错误码段。
    v0.2.0: 认证接口（登录/刷新/登出/验证码）。
  version: "0.2.0"
  contact:
    name: 仗键天涯(daxing)
    email: 3442535897@qq.com

servers:
  - url: http://localhost:8080
    description: 本地开发

# ---------------------------------------------------------------------------
# 安全定义
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    X-Ca-Timestamp:
      name: X-Ca-Timestamp
      in: header
      required: true
      description: Unix 秒时间戳（字符串）
      schema:
        type: string
        example: "1750000000"

    X-Ca-Nonce:
      name: X-Ca-Nonce
      in: header
      required: true
      description: 客户端随机串，建议 16-32 位 [A-Za-z0-9]
      schema:
        type: string
        example: "abc123nonce456def"

    X-Ca-Signature:
      name: X-Ca-Signature
      in: header
      required: true
      description: |
        base64(HMAC-SHA256(hmac_key, SIGNING_STRING))
        SIGNING_STRING = UPPER(method) \n path \n timestamp \n nonce \n BODY_B64
      schema:
        type: string

  schemas:
    # --- T-001 安全信封 ---
    EncryptedEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: string
          description: base64(IV(16B) || AES-256-CBC-PKCS7(plaintext))

    SecurityError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: |
            逻辑错误码 = security_segment_base + offset。
            T-001 offset: +1~+9 (security)
            T-002 offset: +20~+24 (auth)
          example: 11001
        message:
          type: string
          description: i18n key
          example: "security.missing_headers"

    # --- T-002 认证 ---
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 0=成功，其它=错误码
        message:
          type: string
        data:
          description: 业务数据

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        captcha_id:
          type: string
          description: 失败达阈值后必填
        captcha_code:
          type: string
          description: 失败达阈值后必填

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        access_exp:
          type: integer
          format: int64
        refresh_exp:
          type: integer
          format: int64
        token_type:
          type: string
          example: Bearer

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: 可选，同时拉黑 refresh

    CaptchaResponse:
      type: object
      properties:
        captcha_id:
          type: string
        image_base64:
          type: string
          description: data:image/png;base64,...
        expires_in:
          type: integer
          description: 秒

  responses:
    EncryptedResponse:
      description: C 端加密响应
      headers:
        X-Ca-Timestamp:
          schema:
            type: string
        X-Ca-Nonce:
          schema:
            type: string
        X-Ca-Signature:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EncryptedEnvelope"

    SecurityErrorResponse:
      description: 安全校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SecurityError"

# ---------------------------------------------------------------------------
# 路径
# ---------------------------------------------------------------------------
paths:
  /auth/captcha:
    post:
      tags: [Auth]
      summary: 获取图形验证码
      operationId: issueCaptcha
      security: []
      responses:
        "200":
          description: 验证码
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CaptchaResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: 登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TokenResponse"
        "400":
          description: 验证码相关错误 (captcha_required / captcha_invalid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityError"
        "401":
          description: 认证失败 (bad_credentials)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityError"
        "403":
          description: 账号禁用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityError"
        "423":
          description: 账号锁定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityError"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新令牌
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TokenResponse"
        "401":
          description: 令牌无效/过期/已吊销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityError"

  /auth/logout:
    post:
      tags: [Auth]
      summary: 登出
      operationId: logout
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityError"
