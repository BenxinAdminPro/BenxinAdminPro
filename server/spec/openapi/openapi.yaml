      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
        - { name: keyword, in: query, schema: { type: string }, description: "config_key/name 模糊" }
        - { name: config_key, in: query, schema: { type: string }, description: "参数键模糊" }
        - { name: name, in: query, schema: { type: string }, description: "参数名模糊" }
        - { name: is_encrypted, in: query, schema: { type: integer, enum: [0, 1] } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, id] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
