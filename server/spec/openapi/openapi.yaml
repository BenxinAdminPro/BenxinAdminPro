  # --- T-004b 文件管理 ---
  /sys/files:
    post:
      tags: [File]
      summary: 上传文件
      operationId: uploadFile
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 上传成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "413":
          description: 文件过大
        "415":
          description: 文件类型不允许
    get:
      tags: [File]
      summary: 文件列表
      operationId: listFiles
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: uploader, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /sys/files/{id}/download:
    get:
      tags: [File]
      summary: 鉴权下载文件
      operationId: downloadFile
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: 文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /sys/files/{id}:
    delete:
      tags: [File]
      summary: 删除文件
      operationId: deleteFile
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
