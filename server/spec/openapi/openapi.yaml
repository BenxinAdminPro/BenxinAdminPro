          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
    post:
      tags: [System]
      summary: 新建参数
      description: "T-005b-3：is_encrypted=1 时 config_value 经 AES-256-GCM 加密落库（base64(nonce12||ct||tag)），读路径自动解密、列表/详情恒脱敏 ******；=0 明文存。"
      operationId: createConfig
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config_key]
              properties:
                config_key: { type: string }
                config_value: { type: string }
                name: { type: string }
                remark: { type: string }
                is_encrypted:
                  type: integer
                  enum: [0, 1]
                  default: 0
                  description: "0=明文 1=GCM 加密落库（T-005b-3）"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /sys/configs/{id}:
    put:
      tags: [System]
      summary: 更新参数
      description: >-
        T-005b-3：编辑态键/类型锁定 —— 不接受 config_key（唯一键禁改）、不接受 is_encrypted（明↔密切换走删除重建）。
        config_value 指针三态：省略该字段=保持原值不动（密文/明文均不碰）；传入=按该行现有 is_encrypted
        决定（加密行→GCM 重新加密覆盖，明文行→明文覆写）。前端加密行值框留空即省略，绝不回传 ******。
      operationId: updateConfig
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "对外 ID(hashid 字符串)" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config_value:
                  type: string
                  nullable: true
                  description: "省略=保持原值；传入=覆写（加密行重新加密）"
                name: { type: string }
                remark: { type: string }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
    delete:
      tags: [System]
      summary: 删除参数
      operationId: deleteConfig
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: "对外 ID(hashid 字符串)" }]
      responses:
        "200":
